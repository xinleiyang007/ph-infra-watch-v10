name: PH Infra Watch V10 - Collect Translate and Publish
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - 'scripts/**'
      - 'config/**'
      - 'data/projects.json'
      - 'data/companies.json'
      - '.github/workflows/collect-and-deploy.yml'
  schedule:
    # UTC 00:17,06:17,12:17 ~ Manila 08:17,14:17,20:17 (may be delayed)
    - cron: '17 0,6,12 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: ph-infra-v10-publish
  cancel-in-progress: false
jobs:
  collect-deploy:
    name: collect-translate-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore last published leads (avoids pushing main)
        run: python scripts/restore_previous.py
      - name: Collect public Philippine media and news index feeds
        run: python scripts/collect_news.py
      - name: Install PDF and Excel readers
        run: python -m pip install -q 'pymupdf>=1.24,<2' 'openpyxl>=3.1,<4'
      - name: Extract listed public PDF and Excel evidence (best effort)
        continue-on-error: true
        run: python scripts/collect_documents.py
      - name: Suggest cautious project matches (unverified)
        run: python scripts/link_candidates.py
      - name: Restore offline translation model cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/argos-translate/packages
          key: argos-en-zh-2026-v1
      - name: Install offline translation library (best effort)
        continue-on-error: true
        run: python -m pip install -q argostranslate
      - name: Generate optional offline Chinese translations
        run: python scripts/translate_news.py --limit 100
      - name: Optional evidence-constrained AI summaries (secret on server only)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash-lite
        run: python scripts/ai_enrich.py
      - name: Validate data and website
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          python scripts/validate_data.py
      - name: Prepare public static files (exclude source code and secrets)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/data _site/assets _site/config
          cp index.html _site/index.html
          cp assets/app.js assets/style.css _site/assets/
          cp data/*.json _site/data/
          cp config/news_sources.json _site/config/
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/data/projects.json
          test -s _site/data/media_status.json
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages without git push
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Summarize results
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json,os
          f='data/media_status.json';g='data/translation_status.json';a='data/ai_status.json'
          x=json.load(open(f)) if os.path.exists(f) else {};y=json.load(open(g)) if os.path.exists(g) else {};z=json.load(open(a)) if os.path.exists(a) else {}
          msg=f"V10: {x.get('successful_sources','?')}/{x.get('configured_sources','?')} feed sources responded; {x.get('stored_records','?')} matching news leads; {y.get('translated','?')} offline translations this run; AI mode {z.get('mode','?')}; no automatic push to main.\n"
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as w:w.write(msg)
          PY
